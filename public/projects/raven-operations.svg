<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Raven Operations — company management platform entry screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="55%" stop-color="#0a0f1c" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DA6FF" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)" />
  <circle cx="180" cy="120" r="420" fill="url(#glowA)" />
  <circle cx="1290" cy="820" r="460" fill="url(#glowB)" />

  <g opacity="0.5" fill="#F3F6FF">
    <circle cx="330" cy="200" r="1.4" /><circle cx="1120" cy="150" r="1.1" />
    <circle cx="880" cy="90" r="1.3" /><circle cx="240" cy="700" r="1.2" />
    <circle cx="1240" cy="430" r="1.5" /><circle cx="620" cy="820" r="1.1" />
  </g>

  <g transform="translate(720 250)" text-anchor="middle" font-family="Inter, DM Sans, Arial, sans-serif">
    <g transform="translate(-70 -122)">
      <rect x="0" y="0" width="140" height="92" rx="18" fill="#111a33" stroke="#233158" stroke-width="2" />
      <text x="70" y="36" text-anchor="middle" fill="#4DA6FF" font-size="26" font-weight="800" letter-spacing="2">RAVEN</text>
      <text x="70" y="66" text-anchor="middle" fill="#6b7ba3" font-size="17" letter-spacing="3">OPERATIONS</text>
    </g>
    <text x="0" y="20" fill="#8fa2c9" font-size="18" letter-spacing="6" font-family="JetBrains Mono, monospace">INTERNAL OPERATIONS PLATFORM</text>
    <text x="0" y="96" fill="#F3F6FF" font-size="58" font-weight="700">Choose how you want to enter.</text>
    <text x="0" y="146" fill="#93A2C2" font-size="24">Secure company workspace for projects, tasks, attendance, leave and approvals.</text>
  </g>

  <g transform="translate(370 500)" font-family="Inter, DM Sans, Arial, sans-serif">
    <rect x="0" y="0" width="320" height="230" rx="24" fill="#0e1830" stroke="#22406f" stroke-width="2" />
    <circle cx="160" cy="72" r="34" fill="#122040" stroke="#2e5c96" stroke-width="2" />
    <path d="M146 72a14 14 0 0 1 28 0v10a14 14 0 0 1-28 0z" fill="#4DA6FF" opacity="0.85" />
    <text x="160" y="145" text-anchor="middle" fill="#F3F6FF" font-size="25" font-weight="700">Login as Worker</text>
    <text x="160" y="178" text-anchor="middle" fill="#8fa2c9" font-size="18">Employee workspace</text>
    <rect x="70" y="196" width="180" height="3" rx="1.5" fill="url(#accent)" opacity="0.75" />
  </g>

  <g transform="translate(750 500)" font-family="Inter, DM Sans, Arial, sans-serif">
    <rect x="0" y="0" width="320" height="230" rx="24" fill="#0e1830" stroke="#2b2350" stroke-width="2" />
    <circle cx="160" cy="72" r="34" fill="#171a3a" stroke="#5b47a8" stroke-width="2" />
    <path d="M160 52l18 8v16c0 12-8 20-18 24-10-4-18-12-18-24V60z" fill="#8B5CF6" opacity="0.9" />
    <text x="160" y="145" text-anchor="middle" fill="#F3F6FF" font-size="25" font-weight="700">Login as Admin</text>
    <text x="160" y="178" text-anchor="middle" fill="#8fa2c9" font-size="18">Management workspace</text>
    <rect x="70" y="196" width="180" height="3" rx="1.5" fill="#8B5CF6" opacity="0.7" />
  </g>
</svg>
